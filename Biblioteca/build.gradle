plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	//Herramienta para pruebas
	//Genera cobertura de pruebas
	id "jacoco"
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Source: https://mvnrepository.com/artifact/org.mockito/mockito-core
	testImplementation("org.mockito:mockito-core:5.24.0")
	// Source: https://mvnrepository.com/artifact/org.mockito/mockito-junit-jupiter
	testImplementation("org.mockito:mockito-junit-jupiter:5.24.0")
	// PDF de los reportes ( 78)
	implementation 'com.github.librepdf:openpdf:2.0.3'
	
	// Aspecto de auditoría automática (en Spring Boot 4 el starter se llama aspectj)
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	//Tras los tests se generan los reportes
	//Con JaCoCo
	finalizedBy jacocoTestReport
}

jacoco{
	toolVersion = "0.8.15"
}

tasks.register('pruebasUnitarias', Test) {
	description = 'Ejecuta solo las pruebas unitarias (no levanta Spring ni MySQL)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'bussinesLayer.*'
	}
}
jacocoTestReport {

	dependsOn pruebasUnitarias


	executionData.setFrom(layout.buildDirectory.file("jacoco/pruebasUnitarias.exec"))

	reports {
		xml.required = true
		html.required = true
	}
	finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
		violationRules {
			rule{
				limit{
				// exige el 80% de cobertura de pruebas unitarias
				minimum = 0.0
				}
			}
		}
}