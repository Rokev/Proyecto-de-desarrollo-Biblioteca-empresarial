# Configuracion segura para produccion
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# Seguridad adicional: no exponer endpoints internos
springdoc.paths-to-exclude=/admin/**,/internal/**
# Simulación de recuperación: devuelve el token en la respuesta (solo desarrollo)
app.recuperacion.mostrar-token=${MOSTRAR_TOKEN_RECUPERACION:true}
