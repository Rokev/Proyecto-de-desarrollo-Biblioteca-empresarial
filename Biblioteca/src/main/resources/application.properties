spring.application.name=Biblioteca

# Perfil activo por defecto (dev, test o prod)
spring.profiles.active=dev

# MySQL: la base de datos "Biblioteca" se crea sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/Biblioteca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345@/

# Crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion basica de OpenAPI (comun a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**
