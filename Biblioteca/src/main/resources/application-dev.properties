# Configuracion especifica para desarrollo
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Configuracion adicional para desarrollo
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# Mostrar mas detalles en desarrollo
logging.level.org.springdoc=DEBUG

# --- Valores de desarrollo (en prod NO existen) ---
spring.config.import=optional:file:.env[.properties]
spring.datasource.password=${DB_PASSWORD:31828++--pp}
jwt.secret=${JWT_SECRET:libroya-secreto-de-desarrollo-cambiar-en-produccion-123456}
admin.inicial.correo=${ADMIN_CORREO:admin@libroya.com}
admin.inicial.contrasena=${ADMIN_CONTRASENA:Admin12345}
cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# Simulación de recuperación: devuelve el token en la respuesta (solo desarrollo)
app.recuperacion.mostrar-token=${MOSTRAR_TOKEN_RECUPERACION:true}
